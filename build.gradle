plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'parchment', version: "${parchment_version}-${minecraft_version}"
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
    }
}

repositories {
    maven { url = 'https://maven.createmod.net' }       // Create
    maven { url = 'https://maven.tterrag.com/' }        // Registrate
    maven { url = 'https://maven.blamejared.com/' }     // JEI
    mavenCentral()                                       // JUnit
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Classifier "all" — толстый jar Create. Flywheel, Registrate, Ponder и
    // MixinExtras лежат в нём вложенными архивами (META-INF/jarjar), Forge
    // распаковывает их сам, поэтому в рантайме Create полноценен и отдельные
    // объявления не нужны.
    //
    // Но javac внутрь вложенных архивов не смотрит: на compile-classpath
    // Registrate отсутствует. Отсюда и обращение к create:track через реестр
    // вместо AllBlocks.TRACK — та константа типизирована BlockEntry.
    implementation fg.deobf("com.simibubi.create:create-${minecraft_version}:${create_version}:all") {
        transitive = false
    }

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging { events 'passed', 'skipped', 'failed' }
}

tasks.named('jar') {
    manifest {
        attributes([
            'Specification-Title'   : mod_id,
            'Specification-Vendor'  : 'gensh',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor' : 'gensh'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
