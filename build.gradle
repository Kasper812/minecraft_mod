plugins {
    id 'java'
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = parchment_version
    }

    runs {
        configureEach {
            systemProperties.put 'ironroads.debug', 'false'
        }
        client {
            client()
            gameDirectory = file('run')
        }
        server {
            server()
            gameDirectory = file('run-server')
        }
    }

    mods {
        ironroads {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven { url = 'https://maven.createmod.net' }       // Create, Ponder, Flywheel
    // Registrate под 1.21 на maven.tterrag.com не выкладывался — там всё
    // кончается на MC1.20. Отсюда его берёт и сам Create (см. его build.gradle
    // ветки mc1.21.1/dev), поэтому репозиторий тот же, а не «какое-то зеркало».
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    mavenCentral()                                       // JUnit
}

dependencies {
    // Транзитивно тянет Ponder, Flywheel и Registrate тех версий, что Create
    // везёт внутри себя (META-INF/jarjar/metadata.json). Ремапа нет и не нужно:
    // NeoForge и в dev, и в рантайме живёт на официальных именах Mojang.
    implementation "com.simibubi.create:create-${minecraft_version}:${create_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging { events 'passed', 'skipped', 'failed' }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
